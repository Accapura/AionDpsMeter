<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Aion DPS Meter — карта босса</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="skins.css">
<link rel="stylesheet" href="layouts.css">
<style>
.top{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
.top .t{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px}
.map{flex:1;min-height:200px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.22);overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.g{stroke:var(--line);stroke-width:1;opacity:.55}
.lbl{fill:var(--text);font-size:26px;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:6px}
.dot{fill:var(--muted);opacity:.85}
.dot.live{fill:var(--hp)}
.dot.sel{fill:var(--accent)}
.ring{fill:none;stroke:var(--accent);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:p 1.6s ease-out infinite}
@keyframes p{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
.info{font-size:12.5px;color:var(--muted);line-height:1.5}
.info b{color:var(--text)}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body data-win="fbmap">
<div class="shell">
  <div class="top drag"><img src="../assets/logo.png" width="20" height="20" alt="" style="border-radius:5px"><div class="t" id="title">Карта босса</div>
    <button class="icon" id="bMax" aria-label="Развернуть"></button><button class="icon" id="bClose" aria-label="Закрыть"></button></div>
  <div class="body" id="body"><div class="empty">Загрузка…</div></div>
  <div class="grip" id="grip" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M11 4L4 11M11 8L8 11"/></svg></div>
</div>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="fbmap.js"></script>
</body>
</html>
