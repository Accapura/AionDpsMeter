<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Aion DPS Meter — уведомление</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="skins.css">
<link rel="stylesheet" href="layouts.css">
<style>
body{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:8px}
.t{position:relative;flex:none;overflow:hidden;display:flex;align-items:center;gap:12px;color:var(--text)}
.t .x{flex:none;align-self:flex-start}
.ic{flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.k{font-size:12px;color:var(--muted)}
.n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l b{color:var(--accent)}
/* 1. Стекло */
.s-glass{height:96px;border-radius:18px;padding:12px 8px 12px 14px;background:linear-gradient(155deg,rgba(var(--g1),.94),rgba(var(--g2),.94));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.s-glass .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12)}
.s-glass .n{font-size:15.5px}.s-glass .l{font-size:13.5px}
/* 2. Плотная карточка */
.s-solid{height:96px;border-radius:14px;padding:12px 8px 12px 14px;background:rgb(var(--g2));border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.s-solid .ic{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accentFg)}
.s-solid .n{font-size:15.5px}.s-solid .l{font-size:13.5px}
/* 3. Акцентная полоса */
.s-accent{height:96px;border-radius:12px;padding:12px 8px 12px 18px;background:linear-gradient(90deg,rgba(var(--g1),.97),rgba(var(--g2),.97));border:1px solid var(--line)}
.s-accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.s-accent .ic{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--accent)}
.s-accent .n{font-size:13.5px;text-transform:uppercase;letter-spacing:.02em}.s-accent .l{font-size:13px}
/* 4. Минимал — одна строка */
.s-minimal{height:54px;border-radius:999px;padding:0 6px 0 8px;background:rgba(var(--g2),.92);border:1px solid var(--line)}
.s-minimal .ic{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accentFg)}
.s-minimal .k{display:none}.s-minimal .b{flex-direction:row;align-items:baseline;gap:8px}
.s-minimal .n{font-size:14px}.s-minimal .l{font-size:0;flex:none}.s-minimal .l b{font-size:13.5px}
.s-minimal .x{align-self:center}
/* 5. Баннер */
.s-banner{height:114px;border-radius:20px;padding:12px 10px 12px 12px;background:linear-gradient(120deg,var(--accent) -40%,rgba(var(--g1),.96) 35%,rgba(var(--g2),.96));border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.s-banner .ic{width:84px;height:84px;border-radius:18px;background:rgba(0,0,0,.25)}
.s-banner .ic svg{width:44px;height:44px}
.s-banner .n{font-size:17px}.s-banner .l{font-size:14px}.s-banner .l b{font-size:18px}
/* 6. Аврора — мягкое свечение акцентом */
.s-aurora{height:96px;border-radius:20px;padding:12px 8px 12px 14px;background:radial-gradient(130% 160% at 0% 0%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 58%),linear-gradient(155deg,rgba(var(--g1),.96),rgba(var(--g2),.96));border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.s-aurora .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent),0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.s-aurora .n{font-size:15.5px}.s-aurora .l{font-size:13.5px}
/* 7. Неон — тёмная карточка с контуром */
.s-neon{height:96px;border-radius:16px;padding:12px 8px 12px 14px;background:rgba(var(--g2),.97);border:1.5px solid var(--accent);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 0 22px color-mix(in srgb,var(--accent) 16%,transparent)}
.s-neon .ic{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--accent)}
.s-neon .n{font-size:15px}.s-neon .l{font-size:13.5px}
/* 8. Билет — цветной корешок слева и пунктир */
.s-ticket{height:96px;border-radius:14px;padding:12px 8px 12px 0;background:linear-gradient(90deg,rgba(var(--g1),.97),rgba(var(--g2),.97));border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.s-ticket .ic{align-self:stretch;width:74px;margin:-12px 0 -12px 0;border-radius:14px 0 0 14px;background:var(--accent);color:var(--accentFg);border-right:2px dashed rgba(0,0,0,.28)}
.s-ticket .n{font-size:15.5px}.s-ticket .l{font-size:13.5px}
/* 9. Компакт — тонкая карточка без подписи */
.s-compact{height:66px;border-radius:14px;padding:8px 6px 8px 10px;background:rgba(var(--g2),.94);border:1px solid var(--line)}
.s-compact .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1)}
.s-compact .k{display:none}.s-compact .n{font-size:14.5px}.s-compact .l{font-size:12.5px}
.s-compact .x{align-self:center}
/* 10. Таймер — плотная карточка и полоска, которая тает до исчезновения */
.s-timer{height:96px;border-radius:14px;padding:12px 8px 14px 14px;background:rgb(var(--g2));border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.42)}
.s-timer .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1)}
.s-timer .n{font-size:15.5px}.s-timer .l{font-size:13.5px}
.tb{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;background:var(--accent);opacity:.9;animation:tbShrink linear forwards}
@keyframes tbShrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.t.tall.s-compact,.t.tall.s-ticket,.t.tall.s-aurora,.t.tall.s-neon,.t.tall.s-timer{height:auto!important}
.acts{display:flex;gap:6px;margin-top:8px}
.ta{height:28px;padding:0 12px;white-space:nowrap;flex:none;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font:600 12.5px var(--font,inherit);cursor:pointer;transition:background .15s,transform .15s}
.ta:hover{background:rgba(255,255,255,.16)}
.ta.pri{background:linear-gradient(180deg,#ffd68c,#ffac52);border-color:transparent;color:#261b3c}
.ta.pri:hover{filter:brightness(1.07)}
.ta:active{transform:scale(.97)}
.pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ffc66b,#ff963c);transition:width .25s ease}
.t.tall{height:auto!important;min-height:96px}
.s-minimal.tall{border-radius:22px;padding:8px 6px 8px 8px}
/* карточка обновления */
.upd{position:relative;flex:none;height:160px;border-radius:20px;padding:14px 10px 14px 14px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text);overflow:hidden;
  background:radial-gradient(120% 140% at 0% 0%,rgba(255,198,107,.22),transparent 55%),linear-gradient(150deg,rgba(var(--g1),.97),rgba(var(--g2),.97));
  border:1px solid rgba(255,214,150,.28);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.upd.enter{animation:uIn .45s cubic-bezier(.2,.9,.3,1.15)}
.upd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);background-size:250% 100%;animation:uShine 3.2s ease-in-out infinite}
.uh{display:flex;gap:12px;align-items:flex-start}
.uh .x{margin-left:auto;flex:none}
.uic{flex:none;width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#2a1d3e;background:linear-gradient(180deg,#ffd994,#ffad55);box-shadow:0 6px 18px rgba(255,170,80,.35)}
.upd.busy .uic svg{animation:uBob 1.1s ease-in-out infinite}
.ut{min-width:0;display:flex;flex-direction:column;gap:2px}
.uk{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.un{font-size:16px;font-weight:700;white-space:nowrap}
.un b{color:var(--accent)}
.uv{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.uv .old{text-decoration:line-through;opacity:.7}
.uv .new{color:var(--text);font-weight:700}
.uv .ar{color:var(--accent)}
.ul{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ul b{color:var(--accent)}
.ul .err{color:#ffab9e}
.uacts{display:flex;align-items:center;gap:8px;padding-right:4px}
.uacts .ta{height:32px;display:inline-flex;align-items:center;gap:6px;border-radius:11px;padding:0 14px}
.uacts .ta.pri{padding:0 16px;box-shadow:0 4px 14px rgba(255,170,80,.3)}
.link{margin-left:auto;background:none;border:0;color:var(--accent);font:600 12.5px inherit;cursor:pointer;padding:4px 2px}
.link:hover{text-decoration:underline}
.upd .ubar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-right:4px}
.upd .ubar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ffc66b,#ff963c);box-shadow:0 0 12px rgba(255,170,80,.6);transition:width .3s ease}
@keyframes uIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes uShine{0%,60%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes uBob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
</style>
</head>
<body>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="toast.js"></script>
</body>
</html>
