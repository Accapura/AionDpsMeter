  background:radial-gradient(90% 150% at 0% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 62%),radial-gradient(70% 120% at 100% 100%,rgba(255,255,255,.07),transparent 60%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:0 12px 34px rgba(0,0,0,.28)}
.ghCard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.07) 48%,transparent 60%);background-size:260% 100%;animation:ghShine 5.5s ease-in-out infinite}
@keyframes ghShine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.ghIc{flex:none;width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,#2b2340,#120d20);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent),0 0 26px color-mix(in srgb,var(--accent) 35%,transparent),0 10px 24px rgba(0,0,0,.45)}
.ghIc svg{width:38px;height:38px}
.ghBody{position:relative;flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ghName{font-size:22px;letter-spacing:-.01em}
.ghTags{display:flex;gap:6px;flex-wrap:wrap}
.ghTags span{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--muted)}
.ghRepo{font:600 12.5px ui-monospace,Consolas,monospace;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--accent)}
.ghLinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ghLinks button{height:30px;padding:0 13px;font-size:12.5px;border-radius:10px;transition:transform .15s,background .15s}
.ghLinks button:hover{transform:translateY(-1px);background:rgba(255,255,255,.18)}
.ghCard .primary{position:relative;height:42px;padding:0 20px;font-size:14px;transition:transform .15s,filter .15s}
.ghCard .primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.authorCard{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 22px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.authorCard img{border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.authorCard .who{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}
.authorCard .who b{font-size:24px;background:linear-gradient(90deg,var(--accent),var(--text));-webkit-background-clip:text;background-clip:text;color:transparent}
.discord{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px}
.spacer{height:28px}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 22px}
.sl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.16)}
.sl label{font-size:12.5px;color:var(--muted)}
.sl b{font-size:14px;color:var(--accent)}
.sl input{grid-column:1/-1}
.field>label.opt{display:flex;align-items:flex-start;gap:9px;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:400;color:var(--text);line-height:1.4}
.field>label.opt input{margin-top:2px;flex:none}
.field>label.opt span{flex:1;min-width:0}
.dcrow{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;text-align:left}
.dcinfo{flex:1 1 260px;max-width:380px;display:flex;flex-direction:column;gap:8px}
.dcinfo label.opt{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.4}
.dcinfo label.opt input{margin-top:2px;flex:none}
.dcprev{flex:none;width:280px;padding:12px 14px;border-radius:12px;background:#232428;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.35);color:#dbdee1;transition:opacity .3s,filter .3s}
.dcprev.off{opacity:.45;filter:grayscale(1)}
.dch{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#b5bac1;margin-bottom:8px}
.dcb{display:flex;gap:12px;align-items:center}
.dcb img{border-radius:10px;flex:none}
.dct{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:12.5px;line-height:1.35}
.dct b{color:#f2f3f5;font-size:13.5px}
.dcel{color:#23a55a}
.ubar{width:100%;max-width:420px;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
nav > button.upd{position:relative}
nav > button.upd::after{content:"";position:absolute;left:28px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(var(--g2),1)}
.sndgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.sndgrid.off{opacity:.55}
.sndgrid button{height:40px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:12px;font-size:13px;text-align:left}
.sndgrid button .pl{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:var(--accent)}
.sndgrid button .pl svg{width:12px;height:12px}
.sndgrid button.on{color:var(--text);outline:2px solid var(--accent);outline-offset:-2px;background:rgba(255,255,255,.12);font-weight:600}
.sndgrid button.on .pl{background:var(--accent);color:var(--accentFg)}
.vol{width:100%;max-width:420px;box-sizing:border-box}
@media (max-width:640px){.sndgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
.stgrid button{height:auto;padding:10px 6px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px}
.stgrid button.on{color:var(--text);font-weight:600;outline:2px solid var(--accent);outline-offset:-2px;background:rgba(255,255,255,.12)}
.pv{position:relative;display:flex;align-items:center;gap:5px;width:84px;height:34px;padding:0 6px;box-sizing:border-box;overflow:hidden;font-style:normal}
.pv i{font-style:normal}
.pv .pi{flex:none;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;color:var(--accent);background:rgba(255,255,255,.14)}
.pv .pl{flex:1;display:flex;flex-direction:column;gap:4px}
.pv .pl i{display:block;height:4px;border-radius:2px;background:var(--text);opacity:.8}
.pv .pl i+i{width:65%;opacity:.4}
.pv-glass{border-radius:9px;background:linear-gradient(155deg,rgba(var(--g1),.95),rgba(var(--g2),.95));border:1px solid var(--line)}
.pv-solid{border-radius:7px;background:rgb(var(--g2));border:1px solid var(--line)}
.pv-solid .pi{border-radius:50%;background:var(--accent);color:var(--accentFg)}
.pv-accent{border-radius:6px;padding-left:9px;background:rgba(var(--g1),.95);border:1px solid var(--line)}
.pv-accent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.pv-accent .pi{background:none;border:1px solid var(--accent)}
.pv-minimal{height:22px;margin:6px 0;border-radius:999px;padding:0 3px;background:rgba(var(--g2),.95);border:1px solid var(--line)}
.pv-minimal .pi{width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accentFg)}
.pv-minimal .pl i+i{display:none}
.pv-aurora{border-radius:10px;background:radial-gradient(120% 160% at 0% 0%,color-mix(in srgb,var(--accent) 40%,transparent),transparent 60%),rgba(var(--g1),.95);border:1px solid var(--line)}
.pv-aurora .pi{border-radius:50%}
.pv-neon{border-radius:8px;background:rgba(var(--g2),.97);border:1.5px solid var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.pv-neon .pi{background:none;border:1px solid var(--accent)}
.pv-ticket{border-radius:7px;padding-left:0;background:rgba(var(--g1),.95);border:1px solid var(--line)}
.pv-ticket .pi{align-self:stretch;width:24px;height:auto;border-radius:0;background:var(--accent);color:var(--accentFg);border-right:1.5px dashed rgba(0,0,0,.3)}
.pv-compact{height:26px;margin:4px 0;border-radius:8px;background:rgba(var(--g2),.95);border:1px solid var(--line)}
.pv-compact .pl i+i{display:none}
.pv-timer{border-radius:7px;background:rgb(var(--g2));border:1px solid var(--line)}
.pv-timer::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:60%;background:var(--accent)}
.pv-banner{border-radius:9px;padding:0 4px;background:linear-gradient(120deg,var(--accent) -40%,rgba(var(--g1),.96) 40%,rgba(var(--g2),.96));border:1px solid var(--line)}
.pv-banner .pi{width:26px;height:26px;border-radius:7px;background:rgba(0,0,0,.25)}
@media (max-width:700px){.stgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* график боя */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;aspect-ratio:760/230;overflow:visible}
.chart .gl,.dtl .gl{stroke:rgba(255,255,255,.08);stroke-width:1}
.chart .ax,.dtl .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .gap{fill:rgba(255,120,120,.10)}
.dchips{margin-bottom:8px}
.bgsel{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;color:inherit;padding:7px 10px;font:inherit;max-width:100%}.bgsel option{background:#241a3d;color:#efe9ff}
.dstat{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:760px){.dstat{grid-template-columns:1fr}}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 90px 28px;gap:8px;align-items:center;padding:3px 0;font-size:13px}.drow .dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drow .dbar{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}.drow .dbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a7a,#ffc66b)}.drow b{text-align:right}
.fbar{display:flex;gap:8px;flex-wrap:wrap}.fbar>*{width:auto!important;margin:0!important}.fbar input{flex:1;min-width:160px}.fbar input,.fbar select{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;color:inherit;padding:7px 10px;font:inherit}.fbar option{background:#241a3d;color:#efe9ff}
.chart .ph{stroke:rgba(255,198,107,.55);stroke-width:1;stroke-dasharray:3 4}
.chart .phl{fill:var(--accent);font-size:11px;font-weight:700}
.chart .cur{stroke:rgba(255,255,255,.35);stroke-width:1}
.chart .tip{position:absolute;top:6px;pointer-events:none;background:rgba(var(--g2),.96);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;min-width:130px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.chart .tip div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.chart .tip i,.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
/* сравнение */
.cmpsel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cmpsel{grid-template-columns:1fr}}
.ba,.bb{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;font-style:normal;font-size:11px;font-weight:800;margin-right:4px;vertical-align:-3px}
.ba{background:var(--accent);color:var(--accentFg)}
.bb{background:#7fb6ff;color:#14213a}
.dl{font-size:12px;font-weight:700;color:var(--muted)}
.dl.up{color:#8fe8b4}
.dl.down{color:#ff9a8a}
.duo{display:flex;flex-direction:column;gap:3px}
.duo i{display:block;height:6px;border-radius:4px;min-width:2px}
.duo i.a{background:var(--accent)}
.duo i.b{background:#7fb6ff}
/* разбор смерти */
.dchips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.dchips{grid-template-columns:repeat(2,1fr)}}
.dchips>div{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dchips span{font-size:11.5px;color:var(--muted)}
.dchips b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchips small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtl{display:block;width:100%;height:auto;aspect-ratio:760/86}
.dtl circle.dm{fill:rgba(255,138,122,.75);stroke:#ff8a7a}
.dtl circle.cr{fill:rgba(255,198,107,.85);stroke:#ffc66b}
.dtl circle.hl{fill:rgba(127,224,168,.7);stroke:#7fe0a8}
.good{color:#8fe8b4}
.bad{color:#ff9a8a}
.crit{font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(255,198,107,.18);color:var(--accent);margin-left:4px}
/* вебхук */
.whrow{display:flex;gap:8px;width:100%;max-width:600px;margin:0 auto}
.whrow input{flex:1;min-width:0}
details.how{max-width:600px;margin:0 auto;text-align:left;font-size:13px}
details.how summary{cursor:pointer;color:var(--accent);text-align:center}
details.how ol{margin:8px 0 6px 18px;padding:0;display:flex;flex-direction:column;gap:4px}
/* «Что нового» */
.wn-back{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,6,16,.55);backdrop-filter:blur(6px);animation:wnFade .25s ease}
.wn-back.out{animation:wnFadeOut .22s ease forwards}
.wn{width:min(560px,100%);max-height:100%;overflow:auto;border-radius:22px;padding:22px 22px 18px;background:linear-gradient(155deg,rgba(var(--g1),.98),rgba(var(--g2),.98));border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);display:flex;flex-direction:column;gap:16px;animation:wnPop .35s cubic-bezier(.2,.9,.3,1.2)}
.wn-h{display:flex;align-items:center;gap:14px}
.wn-h img{border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.wn-h h2{margin:2px 0 0;font-size:20px}
.wn-l{display:flex;flex-direction:column;gap:8px}
.wn-i{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);opacity:0;animation:wnItem .4s ease forwards;animation-delay:calc(.12s + var(--i) * .06s)}
.wn-ic{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,198,107,.16);color:var(--accent)}
.wn-i b{display:block;font-size:14px}
.wn-i span{font-size:12.5px;color:var(--muted);line-height:1.45}
.wn .primary{min-width:190px;height:40px;font-size:14.5px}
@keyframes wnFade{from{opacity:0}to{opacity:1}}
@keyframes wnFadeOut{to{opacity:0}}
@keyframes wnPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes wnItem{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.profnote{font-size:12.5px;padding:8px 12px;border-radius:10px;background:rgba(255,198,107,.1);border:1px solid rgba(255,198,107,.25);color:var(--text)}
.profnote b{color:var(--accent)}
</style>
</head>
<body data-win="main">
<div class="shell">
  <div class="top drag">
    <img src="../assets/logo.png" width="24" height="24" alt="" style="border-radius:6px">
    <span class="t">Aion DPS Meter</span>
    <button class="icon" id="bMin" aria-label="Свернуть"></button>
    <button class="icon" id="bMax" aria-label="Развернуть"></button>
    <button class="icon" id="bClose" aria-label="Закрыть окно (программа останется в трее)"></button>
  </div>
  <div class="wrap">
    <nav aria-label="Разделы">
      <button data-p="overlay" title="Оверлей"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8M12 17v4"/></svg><span>Оверлей</span></button>
      <button data-p="schedule" title="Расписание"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Расписание</span></button>
      <button data-p="todo" title="Дела"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2L6.8 11M3.5 18l1.2 1.2L6.8 17"/></svg><span>Дела</span></button>
      <button data-p="stats" title="Статистика"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Статистика</span></button>
      <button data-p="chars" title="Персонажи"><svg viewBox="0 0 24 24"><circle cx="11" cy="8" r="4"/><path d="M3 21a8 8 0 0 1 13-6M17 17l4 4M19 15a2 2 0 1 1-4 0a2 2 0 0 1 4 0z"/></svg><span>Персонажи</span></button>
      <button data-p="connect" title="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3a1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Настройки</span></button>
      <button data-p="look" title="Оформление"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><span>Оформление</span></button>
      <button data-p="about" title="О программе"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>О программе</span></button>
      <div id="langBox"></div>
      <div class="side-bottom">
        <div class="char" id="charLine"></div>
        <div class="sys" id="sysLine"></div>
        <div class="pill" id="statusPill"><span class="dot" id="dot"></span><span id="stText"></span></div>
        <button type="button" class="authorBadge" id="authorBadge" title="Автор — написать в Discord"><img src="../assets/logo.png" width="28" height="28" alt=""><span><small>Автор</small><b>Accapura</b></span></button>
      </div>
    </nav>
    <main id="main"></main>
  </div>
  <div class="grip" id="grip" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M11 4L4 11M11 8L8 11"/></svg></div>
</div>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="main.js"></script>
