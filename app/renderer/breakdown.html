<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Aion DPS Meter — разбивка по навыкам</title>
<link rel="stylesheet" href="common.css">
<style>
.top{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
.top .t{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.cls{width:22px;height:22px;object-fit:contain}
.cls.unknown{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.14);font-weight:700;font-size:11px}
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.mets div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.mets span{display:block;font-size:11px;color:var(--muted)}
.mets b{font-size:16px}
.spark{height:56px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line);padding:4px}
.spark svg{width:100%;height:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:-12px;text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:5px 6px;cursor:pointer;white-space:nowrap;background:rgba(var(--g2),.96)}
th:first-child,td:first-child{text-align:left}
th.on{color:var(--accent)}
td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.07);text-align:right;white-space:nowrap}
td.sk{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;min-width:90px}
.bar i{position:absolute;left:0;top:3px;bottom:3px;border-radius:5px;background:var(--accent);opacity:.28}
.bar span{position:relative}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <div class="top drag"><img src="../assets/logo.png" width="20" height="20" alt="" style="border-radius:5px"><div class="t" id="title">Разбивка по навыкам</div>
    <button class="icon" id="bMax" aria-label="Развернуть"></button><button class="icon" id="bClose" aria-label="Закрыть"></button></div>
  <div class="body" id="body"><div class="empty">Загрузка…</div></div>
  <div class="grip" id="grip" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M11 4L4 11M11 8L8 11"/></svg></div>
</div>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="breakdown.js"></script>
</body>
</html>
